[project]
name = "mini-pragma"
version = "1.0.0"
description = "HCB-подобный синтетический генератор банковских событий: 7 потоков, единая лента, реальные дефекты данных"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=3.0.5,<4.0",
    "pyarrow>=25.0.1,<26.0",
    "scikit-learn>=1.9,<2.0",
    "scipy",
    "tokenizers>=0.23.1,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
torch = ["torch==2.13.0"]
# Varlen FlashAttention на CUDA. Необязательна: без неё обучение
# идёт корзинами SDPA.
flash = ["flash-attn>=2.6"]

[project.scripts]
mini-pragma-emit = "src.generator.emit:main"
mini-pragma-show = "src.generator.report.show:main"
mini-pragma-preprocess = "src.preprocessing.run:main"
mini-pragma-tokenize = "src.tokenization.run:main"
mini-pragma-dataset = "src.dataset.run:main"
mini-pragma-temporal = "src.temporal.run:main"
mini-pragma-batches = "src.batching.run:main"
mini-pragma-mask = "src.masking.run:main"
mini-pragma-embed = "src.embedding.run:main"
mini-pragma-events = "src.event.run:main"
mini-pragma-profiles = "src.profile.run:main"
mini-pragma-history = "src.history.run:main"
mini-pragma-mlm = "src.mlm.run:main"
mini-pragma-train = "src.mlm.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "src",
    "src.generator",
    "src.generator.params",
    "src.generator.world",
    "src.generator.life",
    "src.generator.finance",
    "src.generator.behaviour",
    "src.generator.observe",
    "src.generator.report",
    "src.preprocessing",
    "src.preprocessing.canonical",
    "src.tokenization",
    "src.dataset",
    "src.temporal",
    "src.batching",
    "src.masking",
    "src.embedding",
    "src.event",
    "src.profile",
    "src.history",
    "src.mlm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
