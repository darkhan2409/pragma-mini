[project]
name = "mini-pragma"
version = "1.0.0"
description = "HCB-подобный синтетический генератор банковских событий: 7 потоков, единая лента, реальные дефекты данных"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=3.0.5,<4.0",
    "pyarrow>=25.0.1,<26.0",
    "scikit-learn>=1.9,<2.0",
    "scipy",
    "tokenizers>=0.23.1,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
torch = ["torch==2.13.0"]

[project.scripts]
mini-pragma-emit = "src.generator.emit:main"
mini-pragma-report = "src.generator.report.realism:main"
mini-pragma-show = "src.generator.report.show:main"
mini-pragma-preprocess = "src.preprocessing.run:main"
mini-pragma-tokenize = "src.tokenization.run:main"
mini-pragma-dataset = "src.dataset.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "src",
    "src.generator",
    "src.generator.params",
    "src.generator.world",
    "src.generator.life",
    "src.generator.finance",
    "src.generator.behaviour",
    "src.generator.observe",
    "src.generator.report",
    "src.preprocessing",
    "src.preprocessing.canonical",
    "src.preprocessing.semantic",
    "src.tokenization",
    "src.dataset",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
