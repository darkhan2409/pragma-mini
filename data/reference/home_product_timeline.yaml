# ============================================================
# ХРОНОЛОГИЯ ПРОДУКТОВ HOME CREDIT BANK KAZAKHSTAN
# ============================================================
#
# Файл подтверждённых фактов. Python его только загружает и
# проверяет: выдумывать здесь даты, тарифы и ссылки запрещено.
#
# Каждая дата это ПЕРИОД, а не точка:
#   known_period_start / known_period_end  границы знания
#   date_precision  day | month | year | interval | unknown
#
# Месяц или год НЕ превращаются в день. Для симуляции день
# выбирается отдельно политикой params.products.effective_date_policy
# и записывается в каталог как simulation_effective_at.
#
# source обязателен. Если источника действительно нет, пишется
#   source: null
#   confidence: low
#   unresolved_source: true
# и запись попадает в realism report как требующая подтверждения.
#
# Коды SYNTH_* в этом файле запрещены: вымышленные продукты
# живут в params.products.synthetic_products.
# ============================================================

